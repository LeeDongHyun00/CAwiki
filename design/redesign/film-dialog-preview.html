<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>원리 팝업 디자인 시안</title>
<link rel="icon" href="data:,">
<style>
:root{font-family:Arial,'Noto Sans KR',sans-serif;color:#e6e8e4;background:#101416;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,a{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:1px solid #c2d2ba;outline-offset:5px}button{border:0;background:none}button:disabled{cursor:default}figure,p,h1,h2{margin:0}body{overflow:hidden}.scene{position:fixed;inset:0;background:#111416 url('../../docs/redesign/film-dialog-review/scenario-context.png') center/cover no-repeat}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0b101470,transparent 50%)}.open{position:absolute;left:6%;bottom:12%;padding:16px 0;border-bottom:1px solid #84978a;font-size:13px;z-index:1}.open span{margin-left:45px}dialog{padding:0;border:1px solid #c5d5ce1d;color:#e6e8e4;background:#171d1f;width:min(1040px,calc(100vw - 72px));max-width:none;max-height:calc(100dvh - 64px);overflow:hidden;scrollbar-width:none;box-shadow:0 32px 120px #0007;border-radius:3px}dialog::-webkit-scrollbar{display:none}dialog::backdrop{background:#080c1177;backdrop-filter:blur(9px)}dialog[open]{animation:unfold .55s cubic-bezier(.16,1,.3,1)}dialog.leaving{animation:fold .24s ease forwards}dialog.leaving::backdrop{animation:backdrop-out .24s ease forwards}.close{position:absolute;right:21px;top:18px;width:44px;height:44px;z-index:2;color:#c2cbc7;display:grid;place-items:center;transition:color .2s,transform .3s}.close svg{width:18px;height:18px}.close:hover{color:white;transform:rotate(90deg)}.layout{display:grid;grid-template-columns:.92fr 1.08fr;min-height:590px;max-height:calc(100dvh - 64px);overflow-y:auto;scrollbar-width:none}.visual{position:relative;display:flex;align-items:center;justify-content:center;padding:64px 22px 82px;background:radial-gradient(ellipse at 48% 44%,#8faca412,transparent 66%);overflow:hidden}.visual:after{content:'';position:absolute;right:0;top:84px;bottom:84px;width:1px;background:linear-gradient(transparent,#acb9b620,transparent)}.visual img{width:110%;max-width:470px;filter:drop-shadow(0 30px 22px #0006);animation:object-in .85s cubic-bezier(.16,1,.3,1)}.visual-label{position:absolute;bottom:60px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;color:#acb9b4;font-size:11px}.visual-label span:first-child{font-size:13px;color:#d8dfd9;letter-spacing:.07em}.point{position:absolute;left:50%;top:55%;width:11px;height:11px;border-radius:50%;border:1px solid #c2d9bd;background:#29382c;box-shadow:0 0 0 7px #c2d9bd10,0 0 0 17px #c2d9bd06}.point:after{content:'';position:absolute;width:3px;height:3px;border-radius:50%;background:#cfe5c5;left:3px;top:3px}.copy{padding:70px 58px 35px 44px;display:flex;flex-direction:column;align-items:start}.count{font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.08em;color:#9eafa5;display:flex;align-items:center;gap:14px;margin-bottom:29px}.count:after{content:'';width:34px;height:1px;background:#86998b65}h1{outline:none;font-size:clamp(30px,3.4vw,43px);line-height:1.3;letter-spacing:-.065em;font-weight:400;word-break:keep-all;max-width:380px}.lead{margin:24px 0 14px;font-size:16px;line-height:1.7;color:#d2dbd3;word-break:keep-all}.body{color:#aab5b0;font-size:14px;line-height:1.9;word-break:keep-all}.flow{width:100%;display:flex;align-items:start;justify-content:space-between;gap:8px;margin:32px 0 28px;border-top:1px solid #bdcfc51b;padding-top:20px}.flow figure{flex:1;min-width:0;text-align:center}.flow img{width:100%;height:64px;object-fit:contain;opacity:.55}.flow figcaption{font-size:10px;color:#84958d;margin-top:7px;line-height:1.7}.flow .current img{opacity:1}.flow .current figcaption{color:#c6d8bc}.flow .arrow{height:64px;display:grid;place-items:center;color:#899c8b;font-size:14px;font-weight:300}.note{margin-top:auto;max-width:380px;font-size:10px;line-height:1.7;color:#7e8e86;word-break:keep-all}.source{font-size:11px;text-decoration:none;margin-top:14px;color:#aec3b2;min-height:32px;display:inline-flex;align-items:center;gap:20px}.source:hover{color:#e1eddb}.source[hidden]{display:none}@keyframes unfold{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}@keyframes object-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fold{to{opacity:0;transform:translateY(10px)}}@keyframes backdrop-out{to{background:#080c1100;backdrop-filter:blur(0)}}
@media(max-width:740px){dialog{width:calc(100vw - 28px);max-height:calc(100dvh - 28px)}.layout{grid-template-columns:1fr;min-height:0;max-height:calc(100dvh - 28px)}.visual{padding:20px 35px 16px;min-height:170px;height:27dvh;max-height:225px}.visual img{width:62%;max-height:210px;object-fit:contain}.visual:after{inset:auto 26px 0;width:auto;height:1px;background:linear-gradient(90deg,transparent,#acb9b620,transparent)}.visual-label{left:27px;right:27px;bottom:14px;font-size:9px}.visual-label span:first-child{font-size:10px}.point{top:52%;width:8px;height:8px;box-shadow:0 0 0 5px #c2d9bd10,0 0 0 12px #c2d9bd06}.point:after{width:2px;height:2px;left:2px;top:2px}.close{right:8px;top:7px}.copy{padding:26px 27px 25px}.count{font-size:10px;margin-bottom:16px;gap:12px}h1{font-size:29px;max-width:280px;letter-spacing:-.06em}.lead{margin:18px 0 10px;font-size:14px}.body{font-size:13px;line-height:1.85}.flow{margin:22px 0 20px;padding-top:15px}.flow img,.flow .arrow{height:45px}.flow figcaption{font-size:9px;margin-top:5px}.note{font-size:9px;line-height:1.7}.source{margin-top:8px;font-size:10px;min-height:28px}}
@media(max-height:610px) and (min-width:741px){.layout{min-height:0}.copy{padding-top:40px;padding-bottom:24px}.count{margin-bottom:15px}h1{font-size:32px}.lead{margin-top:18px}.flow{margin:22px 0 18px}.visual-label{bottom:38px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene" aria-label="시나리오 배경 시안"><button class="open">원리 자세히 <span>↗</span></button></main>
<dialog aria-labelledby="title">
 <button class="close" aria-label="설명 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg></button>
 <div class="layout">
  <figure class="visual"><img id="hero" src="../../assets/inside/redesign/vrm.webp" alt="메인보드 전원부"><i class="point" aria-hidden="true"></i><figcaption class="visual-label"><span id="part">VRM</span><span id="part-label">메인보드 전원부</span></figcaption></figure>
  <article class="copy"><div class="count" id="count">02 / 06</div><h1 id="title" tabindex="-1" autofocus>작동할 준비를<br>갖추다</h1><p class="lead" id="lead">CPU에 맞는 낮고 안정된 전압으로</p><p class="body" id="body">PSU 전압을 그대로 CPU 코어에 넣지 않습니다 메인보드 VRM의 스위칭 회로가 필요한 전압으로 변환하고 조절합니다</p>
  <div class="flow" aria-label="이 장면의 작동 흐름" id="flow"></div>
  <p class="note">이 장면은 작동 원리를 느리게 펼친 개념 표현입니다<br>실제 배선과 시간·크기의 비율은 다릅니다</p><a class="source" id="source" href="https://learn.microsoft.com/en-us/windows/win32/fileio/flushing-system-buffered-i-o-data-to-disk" target="_blank" rel="noopener noreferrer" hidden>참고 자료 <span>↗</span></a></article>
 </div>
</dialog>
<script>
const dialog=document.querySelector('dialog'),openButton=document.querySelector('.open'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const samples={boot:{count:'02 / 06',title:'작동할 준비를<br>갖추다',lead:'CPU에 맞는 낮고 안정된 전압으로',body:'PSU 전압을 그대로 CPU 코어에 넣지 않습니다 메인보드 VRM의 스위칭 회로가 필요한 전압으로 변환하고 조절합니다',part:'VRM',label:'메인보드 전원부',image:'vrm',flow:[['power','주 전원 공급'],['vrm','전압 변환'],['cpu','CPU에 공급']]},save:{count:'06 / 08',title:'플래시에<br>기록하다',lead:'잠시 보관하던 데이터를 오래 남길 곳에',body:'SSD 컨트롤러는 파일의 논리 주소를 실제 저장 위치에 연결하고 NAND 플래시 메모리에 데이터를 기록합니다 화면의 작은 문서들은 데이터의 이동과 기록 상태를 나타내며 실제 메모리 셀이나 떼어 낸 부품은 아닙니다',part:'SSD',label:'플래시 저장장치',image:'ssd',flow:[['dram','메모리의 데이터'],['ssd','SSD로 전송'],['ssd','NAND에 기록']],source:'https://learn.microsoft.com/en-us/windows/win32/fileio/flushing-system-buffered-i-o-data-to-disk'}};
function showSample(id){const s=samples[id]||samples.boot;for(const k of ['count','lead','body'])document.getElementById(k).textContent=s[k];document.getElementById('title').innerHTML=s.title;document.getElementById('hero').src='../../assets/inside/redesign/'+s.image+'.webp';document.getElementById('hero').alt=s.label;document.getElementById('part').textContent=s.part;document.getElementById('part-label').textContent=s.label;document.getElementById('source').hidden=!s.source;if(s.source)document.getElementById('source').href=s.source;document.getElementById('flow').innerHTML=s.flow.map((f,i)=>(i?'<span class="arrow" aria-hidden="true">→</span>':'')+'<figure class="'+(i===1?'current':'')+'"><img src="../../assets/inside/redesign/'+f[0]+'.webp" alt=""><figcaption>'+f[1]+'</figcaption></figure>').join('')}
function open(){dialog.classList.remove('leaving');if(!dialog.open)dialog.showModal()}
function close(){if(reduced.matches){dialog.close();openButton.focus();return}dialog.classList.add('leaving');setTimeout(()=>{dialog.close();dialog.classList.remove('leaving');openButton.focus()},240)}
openButton.onclick=open;document.querySelector('.close').onclick=close;dialog.addEventListener('cancel',e=>{e.preventDefault();close()});
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.channel!=='film-dialog-review')return;if(e.data.sample)showSample(e.data.sample);open()});
showSample(new URLSearchParams(location.search).get('sample'));open();
</script>
</body></html>
