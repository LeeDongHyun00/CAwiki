<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실리콘 지도 — CAwiki</title>
  <meta name="description" content="컴퓨터 한 대를 펼쳐 놓고, 부품에서 작동 순서까지 따라가는 컴퓨터 아키텍처 지도.">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="silicon">
  <div class="progress"><i></i></div>

  <main class="stagewrap">
    <svg role="img" aria-label="컴퓨터 하드웨어 전체 지도 — 메인보드 위 CPU·GPU·RAM·SSD와 주변 장치"></svg>
    <span class="kernel-badge" title="애니메이션 커널 백엔드"></span>
    <span class="stage-lock">ANIMATING…</span>

    <!-- 리빌 안내 (스크롤 시작 전에만 보임) -->
    <div class="reveal-hint">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <path d="M3 6 L8 11 L13 6" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <button type="button" class="reveal-skip">건너뛰기</button>
    </div>
  </main>

  <!-- 투어 캡션 (리빌이 끝나면 나타남) -->
  <div class="captions" aria-live="polite"></div>
  <nav class="dotnav" aria-label="단계 이동"></nav>

  <script src="./lib/boot-notice.js"></script>
  <script type="module" src="./lib/home.js"></script>
</body>
</html>
